---
# This is a basic GitHub Actions pipeline to validate Terraform
name: Databricks Infrastructure Deploy

on:
  push:
    branches: [ main ]
    paths:
      - "azure/**"
defaults:
  run:
    working-directory: azure
env:
  ARM_CLIENT_ID: ${{ vars.AZURE_AD_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_AD_TENANT_ID }}
  BACKEND_RG_NAME: ${{ vars.BACKEND_RG_NAME }}
  BACKEND_SA_NAME: ${{ vars.BACKEND_SA_NAME }}
  BACKEND_CONTAINER_NAME: ${{ vars.BACKEND_CONTAINER_NAME }}
  BACKEND_KEY: ${{ vars.BACKEND_KEY }}
  TERRAFORM_VERSION: 1.4.6
jobs:
  release-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: prod
    outputs:
      prod_workspace_url: ${{ steps.apply.outputs.prod_workspace_url }}
      prod_catalog_storage: ${{ steps.apply.outputs.prod_catalog_storage }}
      prod_resource_group_name: ${{ steps.apply.outputs.prod_resource_group_name }}
      prod_workspace_name: ${{ steps.apply.outputs.prod_workspace_name }}
    env:
      TF_VAR_location: ${{ vars.TF_VAR_LOCATION }}
      TF_VAR_hub_resource_suffix: ${{ vars.TF_VAR_HUB_RESOURCE_SUFFIX }}
      TF_VAR_dr: ${{ vars.TF_VAR_DR }}
      TF_VAR_spoke_suffix: ${{ vars.TF_VAR_SPOKE_SUFFIX }}
      TF_VAR_spoke_tag: ${{ vars.TF_VAR_SPOKE_TAG }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2.0.0
        with:
          terraform_version: $TERRAFORM_VERSION
          terraform_wrapper: false
      - name: Set up Databricks CLI profile for Terraform provider
        run: |
          echo "[DEFAULT]" >> ~/.databrickscfg
          echo "host = $DATABRICKS_HOST" >> ~/.databrickscfg
          echo "token = $DATABRICKS_TOKEN" >> ~/.databrickscfg
      - name: Check formatting of Terraform code
        id: fmt
        run: |
          terraform fmt -check
      - name: Terraform Init
        id: init
        run: |
          terraform init \
          -backend-config="resource_group_name=$BACKEND_RG_NAME" \
          -backend-config="storage_account_name=$BACKEND_SA_NAME" \
          -backend-config="container_name=$BACKEND_CONTAINER_NAME" \
          -backend-config="key=$BACKEND_KEY"
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      - name: Apply Terraform and Capture Outputs
        id: apply
        run: |
          # Apply Terraform
          terraform apply -no-color -input=false --auto-approve
          
          # Capture outputs directly after successful apply
          echo "Capturing outputs from Terraform..."
          PROD_WORKSPACE_URL=$(terraform output -raw spoke_workspace_info)
          PROD_CATALOG_STORAGE=$(terraform output -json catalog_storage_info)
          PROD_RESOURCE_GROUP_NAME=$(terraform output -raw spoke_resource_group_name)
          PROD_WORKSPACE_NAME=$(terraform output -raw spoke_workspace_name)
          
          # Debug: Show captured values
          echo "🔍 DEBUG: Captured values:"
          echo "  PROD_WORKSPACE_URL: '$PROD_WORKSPACE_URL'"
          echo "  PROD_CATALOG_STORAGE: '$PROD_CATALOG_STORAGE'"
          echo "  PROD_RESOURCE_GROUP_NAME: '$PROD_RESOURCE_GROUP_NAME'"
          echo "  PROD_WORKSPACE_NAME: '$PROD_WORKSPACE_NAME'"
          
          # Set GitHub outputs
          echo prod_workspace_url=$PROD_WORKSPACE_URL >> $GITHUB_OUTPUT
          echo prod_catalog_storage=$PROD_CATALOG_STORAGE >> $GITHUB_OUTPUT
          echo prod_resource_group_name=$PROD_RESOURCE_GROUP_NAME >> $GITHUB_OUTPUT
          echo prod_workspace_name=$PROD_WORKSPACE_NAME >> $GITHUB_OUTPUT
          echo "✅ Production workspace info, catalog storage, and resource group captured"
          
  release-dr:
    needs: [release-prod]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: dr
    env:
      TF_VAR_location: ${{ vars.TF_VAR_LOCATION }}
      TF_VAR_hub_resource_suffix: ${{ vars.TF_VAR_HUB_RESOURCE_SUFFIX }}
      TF_VAR_dr: ${{ vars.TF_VAR_DR }}
      TF_VAR_spoke_suffix: ${{ vars.TF_VAR_SPOKE_SUFFIX }}
      TF_VAR_spoke_tag: ${{ vars.TF_VAR_SPOKE_TAG }}
      TF_VAR_prod_workspace_url: ${{ needs.release-prod.outputs.prod_workspace_url }}
      TF_VAR_prod_catalog_storage: ${{ needs.release-prod.outputs.prod_catalog_storage }}
      TF_VAR_prod_resource_group_name: ${{ needs.release-prod.outputs.prod_resource_group_name }}
      TF_VAR_prod_workspace_name: ${{ needs.release-prod.outputs.prod_workspace_name }}
      TF_VAR_job_spn_client_secret: ${{ secrets.JOB_SPN_CLIENT_SECRET }}
      
    steps:
      - uses: actions/checkout@v3
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2.0.0
        with:
          terraform_version: $TERRAFORM_VERSION
          terraform_wrapper: false
      - name: Set up Databricks cli profile for Terraform provider
        run: |
          echo "[DEFAULT]" >> ~/.databrickscfg
          echo "host = $DATABRICKS_HOST" >> ~/.databrickscfg
          echo "token = $DATABRICKS_TOKEN" >> ~/.databrickscfg
      - name: Check formatting of Terraform code
        id: fmt
        run: |
          terraform fmt -check
      - name: Terraform Init
        id: init
        run: |
          terraform init \
          -backend-config="resource_group_name=$BACKEND_RG_NAME" \
          -backend-config="storage_account_name=$BACKEND_SA_NAME" \
          -backend-config="container_name=$BACKEND_CONTAINER_NAME" \
          -backend-config="key=$BACKEND_KEY"
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      - name: Terraform Apply
        id: apply
        run: terraform apply -no-color -input=false --auto-approve
        continue-on-error: true
      - name: Terraform Apply Status
        if: steps.apply.outcome == 'failure'
        run: exit 1
